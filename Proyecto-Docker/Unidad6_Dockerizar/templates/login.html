{% extends "base.html" %} {% block content %}

<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl p-10">
    <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-2">
      🔐 Iniciar sesión
    </h2>

    <p class="text-center text-gray-500 mb-8">Bienvenido de nuevo 👋</p>

    <form method="POST" class="space-y-5">
      <!-- USUARIO -->
      <div>
        <label class="text-sm font-semibold text-gray-600">Usuario</label>
        <input
          type="text"
          name="username"
          required
          class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition"
        />
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="text-sm font-semibold text-gray-600">Contraseña</label>
        <input
          type="password"
          name="password"
          required
          class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition"
        />
      </div>

      <!-- BOTON -->
      <button
        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-xl font-bold shadow-lg hover:scale-[1.02] transition"
      >
        Entrar
      </button>
    </form>

    <!-- LINK REGISTRO -->
    <p class="text-sm text-center text-gray-500 mt-6">
      ¿No tienes cuenta?
      <a
        href="{{ url_for('register') }}"
        class="text-blue-600 font-semibold hover:underline"
      >
        Regístrate
      </a>
    </p>
  </div>
</div>

{% endblock %}
