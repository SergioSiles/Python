services:
  mongodb:
    image: mongo
    container_name: mongoDB
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - mongoData:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongoGUI
    restart: always
    ports:
      - "8081:8081"
    environment:
      # 🔥 Apunta al servicio "mongodb" (nombre correcto)
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT}:${MONGO_ROOT_PASS}@mongodb:27017/

      # Login web de mongo-express
      ME_CONFIG_BASICAUTH_ENABLED: ${MONGOEX_AUTH}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEX_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEX_PASS}
    depends_on:
      - mongodb

  web:
    build: .
    container_name: flaskApp
    restart: always
    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      SECRET_KEY: ${SECRET_KEY}
      # 🔥 MUY IMPORTANTE: Flask debe usar el servicio "mongodb"
      MONGO_URI_IN: mongodb://${MONGO_ROOT}:${MONGO_ROOT_PASS}@mongodb:27017/

    depends_on:
      - mongodb

volumes:
  mongoData:
